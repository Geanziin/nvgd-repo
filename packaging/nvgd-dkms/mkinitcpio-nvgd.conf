# nvgd: driver nativo para GPUs NVIDIA Turing e mais recentes (GTX Serie 16+)
# Add nvgd for the kernel being built only when DKMS actually installed it.
# Avoid pinning this to a kernel minor (which left 7.3 without a GPU driver).
if modinfo -k "$KERNELVERSION" -n nvgd &>/dev/null; then
    MODULES+=(nvgd)
    # Garantia explícita (não depender só do MODULE_FIRMWARE do módulo):
    # set GSP 615 completo que o driver r615 requisita no boot
    # (gsp/bootloader/ucodes/booter_load/booter_unload, do
    # linux-firmware-nvidia, + sec2-bl, do nvgd-dkms) e os 9 blobs do
    # desbloqueio gpu-unlock 610.43.03 (do nvgd-dkms).
    FILES+=(/usr/lib/firmware/nvidia/ga102/gsp/gsp-615.78.08.bin.zst
            /usr/lib/firmware/nvidia/ga102/gsp/bootloader-615.78.08.bin.zst
            /usr/lib/firmware/nvidia/ga102/gsp/ucodes-615.78.08.bin.zst
            /usr/lib/firmware/nvidia/ga102/gsp/booter_load-615.78.08.bin.zst
            /usr/lib/firmware/nvidia/ga102/gsp/booter_unload-615.78.08.bin.zst
            /usr/lib/firmware/nvidia/ga107/gsp/sec2-bl-615.78.08.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/booter_load_ad102.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/booter_load_ga102.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/gsp_boot_ad102.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/gsp_boot_desc_ad102.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/gsp_boot_desc_ga102.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/gsp_boot_ga102.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/gsp_ga10x.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/v67-ad102-610.43.03-four-plm.bin
            /usr/lib/firmware/gpu-unlock/610.43.03/v67-ga102-610.43.03.bin)
fi
