PACKAGE_NAME="nvgd"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="nvgd"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Keep -j$(nproc): Gentoo convention (Arch pins -j10). The kernel gate below
# matches the Arch dkms.conf — the driver source needs kernel >= 7.2.
MAKE[0]="make -j$(nproc 2>/dev/null || echo 4) KDIR=${kernel_source_dir}"
BUILD_EXCLUSIVE_KERNEL="^([7-9]|[1-9][0-9]+)\."
BUILD_EXCLUSIVE_KERNEL_MIN="7.2"
AUTOINSTALL="yes"
